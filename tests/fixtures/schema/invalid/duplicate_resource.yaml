apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-svc
  namespace: finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      containers:
      - name: app
        image: billing:v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-svc
  namespace: finance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      containers:
      - name: app
        image: billing:v2
