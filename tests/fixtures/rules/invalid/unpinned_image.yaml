apiVersion: v1
kind: Pod
metadata:
  name: unpinned-pod
  namespace: default
spec:
  containers:
  - name: web
    image: nginx # unpinned tag
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    livenessProbe:
      httpGet:
        path: /
        port: 80
    readinessProbe:
      httpGet:
        path: /
        port: 80
