apiVersion: v1
kind: Pod
metadata:
  name: deceptive-annotations-pod
  namespace: default
  annotations:
    vault.hashicorp.com/agent-inject-secret: "database-password"
    security.istio.io/secret: "none"
    auth.example.com/api-token-header: "Authorization"
spec:
  containers:
  - name: main
    image: registry.example.com/app:v1.2.3
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
