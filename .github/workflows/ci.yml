name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Go Engine Lint, Unit Tests, and Smoke Tests
  # -------------------------------------------------------------
  go-ci:
    name: Go Engine Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Verify Go Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: Unformatted Go files found:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Go Unit Tests and Benchmarks
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build Go Binary & Run Smoke Tests
        run: make smoke-test

  # -------------------------------------------------------------
  # Job 2: Python Package Matrix CI (PEP 517 / PEP 621)
  # -------------------------------------------------------------
  python-ci:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Build and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine ruamel.yaml jsonschema

      - name: Version Consistency Check
        shell: bash
        run: |
          INIT_VER=$(python -c "import kubecheck; print(kubecheck.__version__)")
          TOML_VER=$(python -c "import re; print(re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          echo "kubecheck/__init__.py version: $INIT_VER"
          echo "pyproject.toml version:        $TOML_VER"
          if [ "$INIT_VER" != "$TOML_VER" ]; then
            echo "Version mismatch between kubecheck/__init__.py and pyproject.toml!"
            exit 1
          fi

      - name: Build sdist and Wheel (PEP 517)
        run: python -m build

      - name: Validate Package Metadata (Twine Check)
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz

      - name: Install Built Wheel into Clean Environment
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl)
          python -m pip install "$WHEEL"

      - name: Smoke-Test Installed CLI Entry Points
        shell: bash
        run: |
          echo "=== Testing --version ==="
          kubecheck --version
          
          echo "=== Testing --help ==="
          kubecheck --help
          
          echo "=== Testing kubectl-kubecheck plugin shim ==="
          kubectl-kubecheck --help
          
          echo "=== Testing rules list ==="
          kubecheck rules
          
          echo "=== Testing bundle status ==="
          kubecheck bundle status
          
          echo "=== Testing analyze on valid manifest ==="
          kubecheck analyze tests/fixtures/yaml/valid/pod.yaml
          
          echo "=== Testing analyze detection on invalid manifest ==="
          kubecheck analyze tests/fixtures/yaml/invalid/duplicate_key.yaml || test $? -eq 1
